[project]
name = "watchparty"
version = "0.1.0"
description = "Couch Gaffer, a mini-league watch party: synthetic match, manager agents, shared screen."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.22.0",
    "agent-framework-openai==1.17.0",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "azure-identity>=1.26.0",
    "azure-monitor-opentelemetry==1.8.11",
    "azure-storage-blob==12.31.0",
    "azure-storage-queue==12.18.0",
    "fastapi>=0.159.1",
    "mcp==1.30.0",
    "openai>=3.37.0",
    "opentelemetry-api>=1.45.1",
    "pydantic>=2.14.1",
    "redis==8.1.0",
    "redis-entraid==1.2.2",
    "sqlalchemy[asyncio]==2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.86.0",
    "fakeredis[lua]==2.39.0",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    { include-group = "recap" },
]
# Only the recap job's image needs these (#15); the app image stays without them.
recap = [
    "pillow==12.3.0",
]

[tool.uv]
# Transitive packages of azure-monitor-opentelemetry (#111) whose newest releases were under two weeks old on 26 Oct
# (asgiref 3.13.0, 23 Oct; wrapt 2.5.1, 14 Oct). Drop a line once its release is two weeks old.
constraint-dependencies = ["asgiref<3.13", "wrapt<2.5.1"]

[tool.datamodel-codegen]
# Generated from contracts/ (the source of truth). Regenerate with: uv run datamodel-codegen
input = "../contracts/schemas"
input-file-type = "jsonschema"
output = "watchparty/models"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-standard-collections = true
use-union-operator = true
use-annotated = true
field-constraints = true
enum-field-as-literal = "all"
use-schema-description = true
use-title-as-name = true
disable-timestamp = true
formatters = ["ruff-format"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "postgres: needs TEST_DATABASE_URL, a Postgres the test may wipe (skipped without it)",
    "redis: needs Docker for a real Redis (#95); skipped without it",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["watchparty/models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*", "asyncpg", "asyncpg.*", "redis_entraid", "redis_entraid.*", "playwright.*"]
ignore_missing_imports = true
